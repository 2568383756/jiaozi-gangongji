.art img{position:absolute;width:27%;max-height:82%;object-fit:contain;left:50%;top:41%;transform:translate(-50%,-50%);filter:drop-shadow(1px 3px 0 #412e2530)}
.action{padding:7px 14px;background:transparent;color:inherit;border:1px solid currentColor;font-weight:600;border-radius:3px}
.transport{border:0;background:#f2e8d0;color:var(--green);min-width:112px}.transport:hover{background:white}
.deck{background:#f0eadb;padding:16px clamp(16px,3vw,36px);border-bottom:1px solid var(--line)}
.current{display:flex;align-items:center;gap:16px}.current strong{font-size:14px;white-space:nowrap}.seek{flex:1;min-width:55px}.clock{font:13px/1.5 "IBM Plex Mono",Consolas,monospace;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
.mixer{margin-top:12px}summary{font-size:14px;color:var(--green);cursor:pointer;width:max-content;font-weight:600}
.levels{display:flex;flex-wrap:wrap;align-items:center;gap:14px 26px;margin:12px 0}.level{display:flex;align-items:center;gap:6px;font-size:14px}.level span{width:30px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}.level input{width:80px}input{accent-color:var(--green)}input[type=range]{cursor:pointer}.overlay{font-size:14px;display:inline-flex;align-items:center;gap:6px}.stop{color:var(--red);font-size:14px;padding:3px 9px}.stop:disabled{opacity:.48;cursor:default}
.library{padding:0 clamp(16px,3vw,36px) 40px}.tabs{display:flex;gap:clamp(12px,4vw,42px);border-bottom:1px solid var(--line)}.tabs button{flex-shrink:0;position:relative;padding:20px 0 15px;font-weight:bold;color:var(--muted);border:0;border-bottom:3px solid transparent;background:transparent}.tabs button[aria-selected=true]{border-bottom-color:var(--red);color:var(--red)}.tabs small{font:12px/1.2 Consolas,monospace;margin-left:5px}
.group{margin-top:24px}.group h2{font:700 18px/1.4 var(--serif);margin:0 0 10px;color:var(--green)}
.tracks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:32px}.tracks.effects{grid-template-columns:repeat(3,minmax(0,1fr));column-gap:20px}
.track{display:flex;align-items:center;gap:12px;width:100%;padding:13px 3px;border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;text-align:left}.track:hover,.track[aria-pressed=true]{background:#eae6d4}.track[aria-pressed=true]{color:var(--green)}.track .glyph{flex:none;width:28px;height:28px;border:1px solid #b5aa91;display:grid;place-items:center;color:var(--green);border-radius:50%;font:11px/1.1 Arial,sans-serif}.track[aria-pressed=true] .glyph{background:var(--green);border-color:var(--green);color:white}
.label{display:flex;flex:1;flex-direction:column;min-width:0}.label b{font-size:16px;line-height:1.5}.label small{font-size:13px;color:var(--muted);margin-top:2px}.length{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}.note{color:var(--muted);font-size:13px;margin:16px 0 0}.error{color:var(--red);margin:8px 0 0}.error:empty{display:none}

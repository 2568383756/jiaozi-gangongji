<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>交子赶工记 · 分层动画源 v10</title><style>body{margin:0;background:#fae7d3;color:#67402a;font:15px system-ui}canvas{display:block;width:100%;max-height:90vh;object-fit:contain}nav{display:flex;gap:16px;align-items:center;padding:12px 4%}button{background:#8b3927;color:#fff3d7;border:0;padding:9px 22px;border-radius:6px}input{flex:1}</style><canvas width="1920" height="1080"></canvas><nav><button id="play">播放</button><input id="seek" type="range" min="0" max="56" step=".01" value="0"><span id="clock">00 / 56 秒</span></nav><script src="environment.js"></script><script src="ambience.js"></script><script src="characters.js"></script><script src="page-turn.js"></script><script src="composition.js"></script><script>let playing=false,t=0,last=0;const play=document.querySelector('#play'),seek=document.querySelector('#seek');play.onclick=()=>{playing=!playing;if(t>=56)t=0;play.textContent=playing?'暂停':'播放'};seek.oninput=()=>{t=+seek.value;renderFrame(t)};function tick(now){if(playing&&loaded){t=Math.min(56,t+(now-last)/1000);renderFrame(t);seek.value=t;document.querySelector('#clock').textContent=t.toFixed(1)+' / 56 秒';if(t===56){playing=false;play.textContent='重播'}}last=now;requestAnimationFrame(tick)}window.loaded=false;requestAnimationFrame(tick);</script></html>
